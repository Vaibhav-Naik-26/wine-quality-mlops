name: ML Pipeline

on:
  push:
    branches:
      - main

jobs:
  train-test-package:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train and evaluate model
        run: |
          python src/train.py

      - name: Run application tests
        run: |
          python -m pytest -q

      - name: Create model package
        run: |
          mkdir -p package

          cp artifacts/model.joblib package/model.joblib
          cp artifacts/metrics.json package/metrics.json
          cp src/predict.py package/predict.py
          cp requirements.txt package/requirements.txt

          echo "Package contents:"
          ls -la package

      - name: Publish validated model package
        uses: actions/upload-artifact@v4
        with:
          name: model-package-${{ github.run_number }}
          path: package/